<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live volleyball</title>

<style>

/* ------------------------------
BASE
------------------------------ */

:root{
--bgTop:#0b1020;
--bg:#f3f4f6;
--card:#ffffff;
--text:#0f172a;
--muted:#6b7280;
--radius:18px;
--shadow:0 10px 30px rgba(2,6,23,.08);
}

*{box-sizing:border-box}

body{
margin:0;
font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;
background:linear-gradient(180deg,var(--bgTop) 0%,var(--bgTop) 120px,var(--bg) 120px);
color:var(--text);
}

/* ------------------------------
HEADER
------------------------------ */

header{
padding:18px 14px 12px;
max-width:1100px;
margin:auto;
color:#fff;
}

h1{
margin:0;
font-size:18px;
font-weight:800;
}

.sub{
font-size:12px;
opacity:.7;
margin-top:3px;
}

.tabs{
display:flex;
gap:8px;
margin-top:10px;
flex-wrap:wrap;
}

.tab{
border:1px solid rgba(255,255,255,.25);
background:rgba(255,255,255,.1);
color:#fff;
padding:6px 12px;
border-radius:999px;
font-weight:700;
cursor:pointer;
}

.tab.active{
background:#fff;
color:#000;
}

/* ------------------------------
GRID
------------------------------ */

main{
max-width:1100px;
margin:auto;
padding:12px 14px 40px;
}

.grid{
display:grid;
gap:12px;
}

.grid.compact{
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
}

.grid.detailed{
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
}

/* ------------------------------
CARD
------------------------------ */

.card{
background:#fff;
border-radius:18px;
border:1px solid rgba(0,0,0,.06);
box-shadow:var(--shadow);
overflow:hidden;
position:relative;
}

.cardTop{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 14px 6px;
font-size:12px;
font-weight:700;
color:var(--muted);
}

/* ------------------------------
TEAMS
------------------------------ */

.bodyRow{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
padding:8px 12px;
}

.team{
display:flex;
flex-direction:column;
align-items:center;
gap:6px;
text-align:center;
}

.logo{
width:56px;
height:56px;
border-radius:14px;
border:1px solid rgba(0,0,0,.08);
display:grid;
place-items:center;
overflow:hidden;
background:#fff;
}

.logo img{
width:100%;
height:100%;
object-fit:contain;
padding:6px;
}

.teamName{
font-weight:800;
font-size:13px;
line-height:1.1;
}

/* ------------------------------
SCORE
------------------------------ */

.scoreCenter{
text-align:center;
min-width:130px;
}

.scoreLine{
display:flex;
justify-content:center;
gap:6px;
align-items:center;
font-weight:900;
font-size:30px;
font-variant-numeric:tabular-nums;
}

.scoreNum{
width:2ch;
}

.scoreDash{
opacity:.3;
}

.meta{
font-size:12px;
color:var(--muted);
}

.serve{
font-size:11px;
color:var(--muted);
}

/* ------------------------------
TAG
------------------------------ */

.tag{
margin-top:3px;
padding:3px 8px;
font-size:11px;
font-weight:900;
border-radius:999px;
display:inline-block;
}

.tag.sideout{
background:#e0f2fe;
color:#1e40af;
}

.tag.break{
background:#fee2e2;
color:#991b1b;
}

.tag.breakStrong{
background:#fecaca;
color:#7f1d1d;
}

/* ------------------------------
ACTIONS
------------------------------ */

.actions{
display:flex;
justify-content:space-between;
align-items:center;
padding:6px 12px 10px;
}

.btn{
border:1px solid rgba(0,0,0,.1);
background:#fff;
padding:6px 10px;
border-radius:999px;
font-weight:800;
font-size:12px;
cursor:pointer;
}

.btn.primary{
background:#eff6ff;
border-color:#93c5fd;
}

.btn.danger{
background:#fef2f2;
border-color:#fecaca;
}

/* ------------------------------
FAVORITE BADGE
------------------------------ */

.favoriteBadge{
position:absolute;
top:8px;
left:8px;
background:#fffbeb;
border:1px solid #fbbf24;
color:#92400e;
padding:2px 8px;
border-radius:999px;
font-size:11px;
font-weight:800;
}

/* ------------------------------
GROUP HEADER
------------------------------ */

.groupTitle{
font-size:14px;
font-weight:900;
margin:12px 0 4px;
}

/* ------------------------------
MOBILE DENSITY
------------------------------ */

@media(max-width:520px){

.grid.detailed.mobileDense{
grid-template-columns:1fr 1fr;
}

.grid.mobileDense .logo{
width:44px;
height:44px;
}

.grid.mobileDense .scoreLine{
font-size:22px;
}

.grid.mobileDense .meta{
font-size:10px;
}

.grid.mobileDense .actions{
display:none;
}

}

</style>
</head>

<body>

<header>
<h1>Live volleyball</h1>
<div class="sub">Følg kamper og favorittlag</div>

<div class="tabs">
<button class="tab active" id="tabAll">Alle</button>
<button class="tab" id="tabSelected">Valgte kamper</button>
</div>
</header>

<main>

<div id="grid" class="grid compact"></div>

</main>

<script>

/* ------------------------------
API
------------------------------ */

const LIVE_URL="https://volleyball.ronesse.no/live";
const TEAM_URL="https://volleyball.ronesse.no/teams?limit=200&offset=0";
const LOGO_URL=id=>`https://volleyball.ronesse.no/img/teams/${id}.png`;

/* ------------------------------
STATE
------------------------------ */

let liveMatches=[];
let teams=[];
let watchedTeams=new Map();
let currentTab="all";

let followed=JSON.parse(localStorage.getItem("followed")||"[]");

/* ------------------------------
FETCH
------------------------------ */

async function fetchLive(){
const r=await fetch(LIVE_URL);
return await r.json();
}

async function fetchTeams(){
const r=await fetch(TEAM_URL);
return await r.json();
}

/* ------------------------------
BUILD FAVORITE SET
------------------------------ */

function buildTeamMap(list){

const map=new Map();

for(const t of list){

if(!t.sofascore_team_id)continue;

map.set(String(t.sofascore_team_id),{
group:t.group_type,
name:t.name
});

}

return map;

}

function matchFavorite(match){

const h=String(match.home_team_id);
const a=String(match.away_team_id);

if(watchedTeams.has(h))return watchedTeams.get(h);
if(watchedTeams.has(a))return watchedTeams.get(a);

return null;

}

/* ------------------------------
LOGO
------------------------------ */

function makeLogo(id){

const div=document.createElement("div");
div.className="logo";

const img=document.createElement("img");
img.src=LOGO_URL(id);

img.onerror=()=>{
div.innerHTML="<b>?</b>";
};

div.appendChild(img);

return div;

}

/* ------------------------------
RENDER CARD
------------------------------ */

function renderCard(match){

const fav=matchFavorite(match);

const card=document.createElement("div");
card.className="card";

if(fav){

const badge=document.createElement("div");
badge.className="favoriteBadge";
badge.textContent="⭐ Favorittlag";
card.appendChild(badge);

}

const top=document.createElement("div");
top.className="cardTop";
top.textContent=match.tournament_name;

const body=document.createElement("div");
body.className="bodyRow";

const home=document.createElement("div");
home.className="team";
home.appendChild(makeLogo(match.home_team_id));

const hn=document.createElement("div");
hn.className="teamName";
hn.textContent=match.home_team_name;
home.appendChild(hn);

const away=document.createElement("div");
away.className="team";
away.appendChild(makeLogo(match.away_team_id));

const an=document.createElement("div");
an.className="teamName";
an.textContent=match.away_team_name;
away.appendChild(an);

const score=document.createElement("div");
score.className="scoreCenter";

const line=document.createElement("div");
line.className="scoreLine";
line.innerHTML=`<span class="scoreNum">${match.home_p1??0}</span><span class="scoreDash">-</span><span class="scoreNum">${match.away_p1??0}</span>`;

score.appendChild(line);

const meta=document.createElement("div");
meta.className="meta";
meta.textContent=`${match.home_sets} - ${match.away_sets} sett`;

score.appendChild(meta);

body.appendChild(home);
body.appendChild(score);
body.appendChild(away);

const actions=document.createElement("div");
actions.className="actions";

const btn=document.createElement("button");
btn.className="btn primary";
btn.textContent=followed.includes(match.event_id)?"Følger":"Følg";

btn.onclick=()=>{

if(!followed.includes(match.event_id))
followed.push(match.event_id);

localStorage.setItem("followed",JSON.stringify(followed));
render();

};

actions.appendChild(btn);

card.appendChild(top);
card.appendChild(body);
card.appendChild(actions);

return card;

}

/* ------------------------------
RENDER
------------------------------ */

function render(){

const grid=document.getElementById("grid");
grid.innerHTML="";

let matches=liveMatches.filter(m=>m.status_type==="inprogress");

/* FAVORITES FIRST */

matches.sort((a,b)=>{

const af=matchFavorite(a)?1:0;
const bf=matchFavorite(b)?1:0;

if(bf!==af)return bf-af;

return (b.change_ts??0)-(a.change_ts??0);

});

/* GROUPS */

const abroad=[];
const mizuno=[];
const other=[];

for(const m of matches){

const fav=matchFavorite(m);

if(!fav)other.push(m);
else if(fav.group==="abroad")abroad.push(m);
else if(fav.group==="mizuno")mizuno.push(m);

}

/* RENDER GROUP */

function renderGroup(title,list){

if(!list.length)return;

const h=document.createElement("div");
h.className="groupTitle";
h.textContent=title;
grid.appendChild(h);

list.forEach(m=>grid.appendChild(renderCard(m)));

}

renderGroup("⭐ Abroad",abroad);
renderGroup("🇳🇴 Mizuno",mizuno);
renderGroup("Andre kamper",other);

}

/* ------------------------------
REFRESH
------------------------------ */

async function refresh(){

try{

liveMatches=await fetchLive();

if(!teams.length){
teams=await fetchTeams();
watchedTeams=buildTeamMap(teams);
}

render();

}catch(e){

console.error(e);

}

}

/* ------------------------------
START
------------------------------ */

refresh();
setInterval(refresh,10000);

</script>

</body>
</html>
